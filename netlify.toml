[build]
  command = "npm run build"
  publish = "dist"

# Conserve l’API Render existante. À changer si son URL de test est différente.
[[redirects]]
  from = "/api/*"
  to = "https://adminfacile.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
