<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AdminFacile</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="notification" class="notification" role="status" aria-live="polite"></div>

  <nav class="navbar">
    <div class="logo">AdminFacile</div>

    <div class="nav-links">
      <a href="#">Accueil</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>

      <button id="btnTheme" onclick="changerTheme()">
        🌙 Mode sombre
      </button>
    </div>
  </nav>

  <header class="hero">
    <h1>AdminFacile</h1>
    <p>
      L’assistant administratif intelligent pour étudiants et jeunes actifs.
    </p>
  </header>

  <section class="auth-box">
    <h2>Connexion</h2>

    <label for="email" class="visuellement-cache">Email</label>
    <input id="email" type="email" placeholder="Email" autocomplete="email" />
    <label for="password" class="visuellement-cache">Mot de passe</label>
    <input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" />

    <div class="actions">
      <button onclick="creerCompte()">Créer un compte</button>
      <button onclick="connexion()">Connexion</button>
      <button onclick="deconnexion()">Déconnexion</button>
      <button onclick="reinitialiserMotDePasse()">🔑 Mot de passe oublié ?</button>
    </div>
  </section>
  <script type="module" src="script.js"></script>

</body>
</html>
